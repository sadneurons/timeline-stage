project:
  type: default
  output-dir: _site
  render:
    - index.qmd
  resources:
    - images/      # pictures named only in timeline.yml are not found by Quarto on its own

format:
  revealjs:
    width: 1280
    height: 720
    filters:
      - timeline-stage
    revealjs-plugins:
      - timeline-stage
